<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Portal Borrower · Miami Lending Advisors</title>
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap">
<style>
  :root{
    --navy:#111111; --sobre-navy:#B9C9DA; --hero:#111111;
    --fondo:#F2F3F5; --tarjeta:#FFFFFF; --texto:#141414; --suave:#5E6672; --linea:#E3E6EA;
    --mar:#2F6B93; --mar-bg:#E6F0F7; --azul-claro:#6FA8CF;
    --pen:#9A3412; --pen-bg:#FDEBDC; --rev:#4B5563; --rev-bg:#ECEEF1; --nota:#FFF6EC;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --navy:#F2F4F7; --sobre-navy:#3A4656; --hero:#1C1C1C;
      --fondo:#0B0B0C; --tarjeta:#18191B; --texto:#EDEFF2; --suave:#A3A9B2; --linea:#2A2D31;
      --mar:#8EC0E0; --mar-bg:#1A2B38; --azul-claro:#6FA8CF; --pen:#F5A97A; --pen-bg:#3A2316; --rev:#C4C9D0; --rev-bg:#26292D; --nota:#2A2117;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --navy:#F2F4F7; --sobre-navy:#3A4656; --hero:#1C1C1C;
    --fondo:#0B0B0C; --tarjeta:#18191B; --texto:#EDEFF2; --suave:#A3A9B2; --linea:#2A2D31;
    --mar:#8EC0E0; --mar-bg:#1A2B38; --azul-claro:#6FA8CF; --pen:#F5A97A; --pen-bg:#3A2316; --rev:#C4C9D0; --rev-bg:#26292D; --nota:#2A2117;
    color-scheme: dark;
  }
  :root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  *,*::before,*::after{box-sizing:border-box}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{margin:0;background:var(--fondo);color:var(--texto);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
  main.con-barra{padding-bottom:110px}
  h1,h2,h3{margin:0;line-height:1.2}
  button{font:inherit;color:inherit}
  .oculto{display:none!important}
  .cargando{opacity:.55;pointer-events:none}
  .titulo-f{font-family:"Montserrat","Plus Jakarta Sans",sans-serif}

  /* Encabezado */
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
  .marca{font-family:"Montserrat","Plus Jakarta Sans",sans-serif;font-weight:800;font-size:13px;color:var(--texto);letter-spacing:.08em;text-transform:uppercase;line-height:1.15}
  .marca span{display:block;font-weight:600;font-size:10px;letter-spacing:.22em;color:var(--mar);margin-top:3px}
  .refrescar{background:none;border:1.5px solid var(--linea);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--suave);cursor:pointer;flex:none}
  .hola{font-family:"Montserrat","Plus Jakarta Sans",sans-serif;font-size:28px;font-weight:800;letter-spacing:-.02em;margin:2px 0 18px}

  /* Acceso */
  .acceso{background:var(--tarjeta);border-radius:22px;padding:22px}
  .acceso h1{font-family:"Montserrat","Plus Jakarta Sans",sans-serif;font-size:24px;font-weight:800;letter-spacing:-.01em}
  .acceso p.intro{color:var(--suave);margin:6px 0 18px;font-size:15px}
  .acceso label{display:block;font-size:13px;font-weight:600;color:var(--suave);margin-bottom:6px}
  .acceso input{display:block;width:100%;font:inherit;font-size:24px;letter-spacing:.3em;text-align:center;color:var(--texto);background:var(--fondo);border:1.5px solid var(--linea);border-radius:14px;padding:14px}
  .acceso input:focus{outline:none;border-color:var(--navy)}
  .error{color:var(--pen);font-size:14px;margin:10px 0 0;min-height:20px}
  .ayuda{color:var(--suave);font-size:13px;margin:12px 0 0;text-align:center}
  .btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer;background:var(--navy);color:#fff}
  .btn.ancho{width:100%;padding:15px;font-size:16px;border-radius:14px;margin-top:8px}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#0B0B0C}}
  :root[data-theme="dark"] .btn{color:#0B0B0C}
  .btn.sec{background:none;color:var(--navy);border:1.5px solid var(--linea)}

  /* Hero */
  .hero{background:var(--hero);color:#fff;border-radius:22px;padding:22px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
  .anillo{width:92px;height:92px;position:relative}
  .anillo svg{width:100%;height:100%;transform:rotate(-90deg)}
  .anillo .base{stroke:rgba(255,255,255,.18)}
  .anillo .lleno{stroke:var(--azul-claro);transition:stroke-dashoffset .8s ease}
  .anillo .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
  .anillo .num b{font-size:24px;font-weight:800;display:block}
  .anillo .num small{font-size:11px;color:#B9C9DA;display:block;margin-top:3px}
  .hero h2{font-family:"Montserrat","Plus Jakarta Sans",sans-serif;font-size:20px;font-weight:700;letter-spacing:-.01em}
  .hero p{margin:6px 0 0;color:#C9D4E5;font-size:14px}
  .hero .ir{margin-top:12px;display:inline-flex;align-items:center;gap:6px;background:#fff;color:#111;border:0;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer}

  .datos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 0}
  .dato{background:var(--tarjeta);border-radius:16px;padding:14px 16px}
  .dato small{display:block;color:var(--suave);font-size:13px}
  .dato strong{font-size:17px;font-weight:700;color:var(--texto)}

  /* Secciones */
  .seccion{margin-top:28px}
  .seccion > h2{font-family:"Montserrat","Plus Jakarta Sans",sans-serif;font-size:18px;font-weight:800;letter-spacing:-.01em;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .etapas{background:var(--tarjeta);border-radius:18px;padding:18px 16px}
  .riel{display:flex;align-items:center;gap:6px}
  .riel i{flex:1;height:6px;border-radius:999px;background:var(--linea)}
  .riel i.hecha{background:var(--azul-claro)}
  .riel i.actual{background:linear-gradient(90deg,var(--azul-claro) 50%,var(--linea) 50%)}
  .etapa-actual{margin-top:12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .etapa-actual b{font-size:16px}
  .etapa-actual span{font-size:13px;color:var(--suave);white-space:nowrap}
  .link{background:none;border:0;padding:4px 0;color:var(--navy);font-weight:600;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .lista-etapas{list-style:none;margin:10px 0 0;padding:0;font-size:14px}
  .lista-etapas li{display:flex;gap:10px;align-items:center;padding:6px 0;color:var(--suave)}
  .lista-etapas li::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--linea);flex:none}
  .lista-etapas li.hecha{color:var(--texto)} .lista-etapas li.hecha::before{background:var(--azul-claro);border-color:var(--azul-claro)}
  .lista-etapas li.actual{color:var(--texto);font-weight:700} .lista-etapas li.actual::before{border-color:var(--azul-claro);box-shadow:0 0 0 3px var(--mar-bg)}

  .filtro{display:inline-flex;background:var(--tarjeta);border-radius:999px;padding:3px;gap:2px;font-family:"Plus Jakarta Sans",sans-serif}
  .filtro button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--suave);cursor:pointer}
  .filtro button[aria-pressed="true"]{background:var(--navy);color:#fff}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .filtro button[aria-pressed="true"]{color:#0B0B0C}}
  :root[data-theme="dark"] .filtro button[aria-pressed="true"]{color:#0B0B0C}

  /* Bloques */
  details.bloque{background:var(--tarjeta);border-radius:18px;margin-top:10px;overflow:hidden}
  details.bloque > summary{list-style:none;cursor:pointer;padding:16px;display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;align-items:center}
  details.bloque > summary::-webkit-details-marker{display:none}
  details.bloque > summary:focus-visible{outline:2px solid var(--navy);outline-offset:-2px;border-radius:18px}
  .b-tit{font-weight:700;font-size:16px;min-width:0}
  .b-sub{grid-column:1 / -1;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--suave)}
  .mini{flex:1;max-width:140px;height:5px;border-radius:999px;background:var(--linea);overflow:hidden}
  .mini span{display:block;height:100%;background:var(--azul-claro);border-radius:999px}
  .chev{width:9px;height:9px;border-right:2px solid var(--suave);border-bottom:2px solid var(--suave);transform:rotate(45deg);margin:-4px 4px 0;transition:transform .2s}
  details[open] > summary .chev{transform:rotate(-135deg);margin-top:4px}
  .cuerpo{padding:0 16px 8px;border-top:1px solid var(--linea)}
  .doc{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--linea)}
  .doc:last-child{border-bottom:0}
  .doc .n{font-size:15px}
  .doc .nota{display:block;margin-top:6px;font-size:13px;color:var(--pen);background:var(--nota);padding:7px 10px;border-radius:10px}
  .pill{flex:none;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .Pendiente{background:var(--pen-bg);color:var(--pen)}
  .Revision{background:var(--rev-bg);color:var(--rev)}
  .Aprobado{background:var(--mar-bg);color:var(--mar)}
  .vacio{background:var(--tarjeta);border-radius:18px;padding:18px;margin-top:10px;color:var(--suave);font-size:14px}

  /* Propiedades */
  .grupo-prop{font-size:15px;font-weight:800;color:var(--texto);margin:20px 0 0}
  .subt{font-size:13px;color:var(--suave);margin:2px 0 0}
  .resumen{padding:12px 0 4px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .resumen b{color:var(--suave);font-weight:600}
  .form{padding:12px 0 6px}
  .form label{display:block;font-size:13px;font-weight:600;color:var(--suave);margin-bottom:4px}
  .form input{display:block;width:100%;font:inherit;font-size:16px;color:var(--texto);background:var(--fondo);border:1.5px solid var(--linea);border-radius:12px;padding:12px 14px;margin-bottom:12px}
  .form input:focus{outline:none;border-color:var(--navy)}
  .fila-botones{display:flex;gap:8px}
  .msg{font-size:13px;margin:8px 0 0;min-height:18px}
  .nueva{background:var(--tarjeta);border-radius:18px;margin-top:10px;padding:14px 16px 8px}
  .agregar{width:100%;margin-top:10px;background:none;border:1.5px dashed var(--sobre-navy);border-radius:18px;padding:14px;color:var(--navy);font-weight:700;font-size:14px;cursor:pointer}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .agregar{border-color:var(--linea)}}
  :root[data-theme="dark"] .agregar{border-color:var(--linea)}

  /* Equipo */
  .persona{background:var(--tarjeta);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
  .ini{width:42px;height:42px;border-radius:50%;background:var(--mar-bg);color:var(--mar);display:grid;place-items:center;font-weight:800;flex:none}
  .persona .q{flex:1;min-width:140px}
  .persona .q b{display:block;font-size:15px}
  .persona .q small{color:var(--suave);font-size:13px}
  .persona .acc{display:flex;gap:6px}
  .persona a{flex:none;font-size:13px;font-weight:700;color:var(--navy);text-decoration:none;border:1.5px solid var(--linea);border-radius:999px;padding:7px 12px}

  /* Pie legal */
  footer{margin-top:28px;font-size:12px;color:var(--suave);text-align:center;line-height:1.55}
  footer a{color:inherit;text-decoration:underline}
  .disclosure{margin:12px auto 0;max-width:640px;font-size:11px;text-align:justify;text-align-last:center;hyphens:auto}
  .ny{font-size:11px;margin-top:2px}
  .eho{display:flex;flex-direction:column;align-items:center;margin:14px 0 8px}
  .eho-t{font-size:6.5px;font-weight:700;line-height:1.15;letter-spacing:.04em;margin-top:2px}
  .lic{font-size:11px;margin-top:4px}

  /* Barra fija para subir */
  .barra-subir{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--fondo) 70%,transparent);z-index:5}
  .barra-subir a{display:flex;justify-content:center;align-items:center;gap:8px;max-width:528px;margin:0 auto;background:var(--navy);color:#fff;text-decoration:none;font-weight:700;border-radius:16px;padding:15px;font-size:16px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .barra-subir a{color:#0B0B0C}}
  :root[data-theme="dark"] .barra-subir a{color:#0B0B0C}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<div class="barra-subir oculto" id="barra"><a href="#" id="subir" target="_blank" rel="noopener"></a></div>

<script>

var PORTAL_ID = (new URLSearchParams(window.location.search).get('c') || '').replace(/[^A-Za-z0-9]/g,'').slice(0,20);
var codigoGuardado = '';
var ABIERTOS = {}, SOLO_FALTA = false, EDITANDO = {}, AGREGANDO = null, VER_ETAPAS = false;

/* Títulos de secciones: en inglés para todos los clientes */
var SEC = {prestamo:'Your Loan', docs:'Your Documents', props:'Properties', principal:'Primary Residence',
           us:'U.S. Properties', otras:'Other Properties', equipo:'Your MLA Team'};

};
var ETAPAS = ['Solicitud recibida','Reunión de documentos','Enviado al banco','Avalúo y condiciones','Aprobación final','Cierre'];
var ETAPAS_VER = ['Solicitud recibida','Recopilación de documentos','Análisis de crédito','Avalúo y condiciones','Aprobación final','Cierre'];
var ETAPAS_EN = ['Application received','Document collection','Underwriting','Appraisal and conditions','Final approval','Closing'];
var CATEGORIAS_EN = {'Identificación':'Personal Documents','Ingresos':'Income','Fondos':'Assets','Empresa (LLC)':'Corporate Documents (LLC)','Compra':'Purchase','Otras propiedades':'Other Properties','Para firmar':'Documents to Sign'};

function el(tag,clase,texto){var n=document.createElement(tag);if(clase)n.className=clase;if(texto!=null)n.textContent=texto;return n;}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}
function claseEstado(e){var n=norm(e);return n.indexOf('aprob')===0?'Aprobado':(n.indexOf('revis')>-1?'Revision':'Pendiente');}
function fmt(s,o){return s.replace(/\{(\w+)\}/g,function(_,k){return o[k];});}
function fechaBonita(iso,idioma){if(!iso)return '—';var p=iso.split('-');var d=new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));
  return d.toLocaleDateString(idioma==='en'?'en-US':'es-ES',{day:'numeric',month:'long',year:'numeric'});}
function dinero(n){return n?'$'+Math.round(n).toLocaleString('en-US'):'—';}
function contar(l,c){return l.filter(function(x){return claseEstado(x.estado)===c;}).length;}

/* ---------- Conexión ---------- */
function pedir(codigo, listo){
  fetch(API_URL,{method:'POST',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({c:PORTAL_ID,codigo:codigo})})
  .then(function(r){return r.json();})
  .then(function(r){listo(r&&typeof r.ok==='boolean'?r:{ok:false,motivo:'red'});})
  .catch(function(){listo({ok:false,motivo:'red'});});
}
function accion(datos, listo){
  datos.c=PORTAL_ID; datos.codigo=codigoGuardado;
  fetch(API_URL,{method:'POST',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(datos)})
  .then(function(r){return r.json();})
  .then(function(r){listo(r&&typeof r.ok==='boolean'?r:{ok:false,motivo:'red'});})
  .catch(function(){listo({ok:false,motivo:'red'});});
}

/* ---------- Pantalla de acceso ---------- */
function encabezado(app,derecha){
  var top=el('div','top'); var m=el('div','marca','Miami Lending Advisors'); m.appendChild(el('span',null,'Portal Borrower')); top.appendChild(m);
  if(derecha) top.appendChild(derecha); app.appendChild(top);
}
function pantallaAcceso(mensaje){
  var t=T.es, app=document.getElementById('app'); app.innerHTML=''; app.className='';
  document.getElementById('barra').classList.add('oculto');
  encabezado(app);
  var c=el('section','acceso'); c.appendChild(el('h1',null,t.titulo)); c.appendChild(el('p','intro',t.intro));
  var lab=el('label',null,t.codigo); lab.htmlFor='codigo'; c.appendChild(lab);
  var inp=el('input'); inp.id='codigo'; inp.type='text'; inp.inputMode='numeric'; inp.autocomplete='one-time-code'; inp.maxLength=6; inp.placeholder='••••••'; c.appendChild(inp);
  var err=el('p','error',mensaje||''); err.setAttribute('role','alert'); c.appendChild(err);
  var b=el('button','btn ancho',t.entrar); b.type='button'; c.appendChild(b);
  c.appendChild(el('p','ayuda',t.ayudaCodigo)); app.appendChild(c);
  app.appendChild(pie(t));
  if(!PORTAL_ID){err.textContent=t.errLink;b.disabled=true;return;}
  function enviar(){var cod=inp.value.replace(/\D/g,''); if(cod.length<6){err.textContent=t.errCodigo;return;}
    c.classList.add('cargando'); pedir(cod,function(r){c.classList.remove('cargando');
      if(r.ok){codigoGuardado=cod;pantallaPortal(r.portal);}
      else{err.textContent=r.motivo==='bloqueado'?t.errBloq:(r.motivo==='inactivo'?t.errInactivo:(r.motivo==='red'?t.errRed:t.errCodigo));}});}
  b.addEventListener('click',enviar); inp.addEventListener('keydown',function(e){if(e.key==='Enter')enviar();}); inp.focus();
}

/* ---------- Bloques que se despliegan ---------- */
function bloque(clave,titulo,docs,t,extra){
  var visibles=SOLO_FALTA?docs.filter(function(d){return claseEstado(d.estado)==='Pendiente';}):docs;
  if(SOLO_FALTA && !visibles.length && !extra) return null;
  var det=el('details','bloque'); if(ABIERTOS[clave]) det.open=true;
  det.addEventListener('toggle',function(){ABIERTOS[clave]=det.open;});
  var s=el('summary'); s.appendChild(el('span','b-tit',titulo));
  var pend=contar(docs,'Pendiente'), apr=contar(docs,'Aprobado');
  if(docs.length){
    s.appendChild(pend? el('span','pill Pendiente', pend===1?t.bFalta1:fmt(t.bFaltanN,{n:pend}))
                      : (apr===docs.length? el('span','pill Aprobado',t.completo) : el('span','pill Revision',t.enRev)));
  } else s.appendChild(el('span'));
  s.appendChild(el('span','chev'));
  if(docs.length){
    var sub=el('div','b-sub'); var mini=el('div','mini'); var f=el('span'); f.style.width=Math.round(apr/docs.length*100)+'%'; mini.appendChild(f);
    sub.appendChild(mini); sub.appendChild(el('span',null,fmt(t.bAprob,{a:apr,b:docs.length}))); s.appendChild(sub);
  }
  det.appendChild(s);
  var c=el('div','cuerpo'); if(extra) c.appendChild(extra);
  visibles.forEach(function(d){
    var r=el('div','doc'); var n=el('div','n',d.nombre); if(d.nota) n.appendChild(el('span','nota',d.nota));
    var ce=claseEstado(d.estado); r.appendChild(n); r.appendChild(el('span','pill '+ce,t.estados[ce])); c.appendChild(r);
  });
  det.appendChild(c); return det;
}

/* ---------- Propiedades ---------- */
function formulario(prop,t,tipo,nueva,alCancelar){
  var f=el('div','form'), sufijo=prop.id||('n'+tipo);
  var l1=el('label',null,t.direccion); var i1=el('input'); i1.type='text'; i1.maxLength=300; i1.id='dir_'+sufijo; l1.htmlFor=i1.id; i1.value=prop.direccion||''; i1.autocomplete='street-address';
  var l2=el('label',null,t.valor); var i2=el('input'); i2.type='text'; i2.maxLength=60; i2.id='val_'+sufijo; l2.htmlFor=i2.id; i2.value=prop.valor||''; i2.placeholder=t.phValor;
  f.appendChild(l1);f.appendChild(i1);f.appendChild(l2);f.appendChild(i2);
  var fb=el('div','fila-botones'); var g=el('button','btn',(nueva&&tipo!=='Principal')?t.agregarBtn:t.guardar); g.type='button'; fb.appendChild(g);
  if(alCancelar){var c=el('button','btn sec',t.cancelar); c.type='button'; c.addEventListener('click',alCancelar); fb.appendChild(c);}
  f.appendChild(fb);
  var msg=el('p','msg'); msg.setAttribute('aria-live','polite'); f.appendChild(msg);
  g.addEventListener('click',function(){
    var dir=i1.value.trim(); if(!dir){msg.style.color='var(--pen)'; msg.textContent=t.errDir; i1.focus(); return;}
    f.classList.add('cargando'); msg.textContent='';
    accion({accion:nueva?'agregarPropiedad':'guardarPropiedad',tipo:tipo,propiedad:prop.id||'',direccion:dir,valor:i2.value.trim()},function(r){
      f.classList.remove('cargando');
      if(r.ok&&(!r.portal||!r.portal.propiedades)) r={ok:false,motivo:'version'};
      if(r.ok){ if(prop.id){EDITANDO[prop.id]=false; ABIERTOS['p_'+prop.id]=true;} AGREGANDO=null; pantallaPortal(r.portal,true); }
      else { msg.style.color='var(--pen)'; msg.textContent=r.motivo==='maxPropiedades'?t.errMax:t.errGuardar; }
    });
  });
  return f;
}
function propiedad(p,docs,t){
  var tipo=p.tipo||'País';
  var titulo=(tipo==='Principal'?SEC.principal:p.nombre)+(p.direccion?': '+p.direccion:'');
  var clave='p_'+p.id, extra;
  if(p.direccion && !EDITANDO[p.id]){
    extra=el('div','resumen'); var sp=el('span'); sp.appendChild(el('b',null,t.valor+': ')); sp.appendChild(document.createTextNode(p.valor||'—'));
    var ed=el('button','link',t.editar); ed.type='button'; ed.addEventListener('click',function(){EDITANDO[p.id]=true; ABIERTOS[clave]=true; pintar();});
    extra.appendChild(sp); extra.appendChild(ed);
  } else {
    if(!p.direccion && ABIERTOS[clave]===undefined) ABIERTOS[clave]=true;
    extra=formulario(p,t,tipo,false,p.direccion?function(){EDITANDO[p.id]=false;pintar();}:null);
  }
  return bloque(clave,titulo,docs,t,extra);
}

/* ---------- Portal ---------- */
var PORTAL=null;
function pantallaPortal(p, mantener){ PORTAL=p; pintar(); if(!mantener) window.scrollTo(0,0); }
function pintar(){
  var p=PORTAL, en=p.idioma==='en', t=en?T.en:T.es;
  document.documentElement.lang=en?'en':'es';
  var app=document.getElementById('app'); app.innerHTML='';
  var docs=p.documentos||[], props=p.propiedades||[], ids=props.map(function(x){return x.id;});
  var generales=docs.filter(function(x){return !x.propiedad||ids.indexOf(x.propiedad)===-1;});
  var apr=contar(docs,'Aprobado'), pend=contar(docs,'Pendiente');

  var rf=el('button','refrescar',t.actualizar); rf.type='button';
  rf.addEventListener('click',function(){rf.classList.add('cargando'); pedir(codigoGuardado,function(r){ if(r.ok) pantallaPortal(r.portal,true); else pantallaAcceso(); });});
  encabezado(app,rf);
  var nombre=String(p.cliente||'').split(/\s+y\s+|\s+and\s+|\s*&\s*/i).map(function(x){var w=x.trim().split(/\s+/);return w.length>2?w.slice(0,-1).join(' '):w[0];}).join(en?' & ':' y ');
  app.appendChild(el('h1','hola',t.hola+nombre));

  // Lo que falta
  var hero=el('section','hero'); var an=el('div','anillo'); var R=40, C=2*Math.PI*R, pct=docs.length?apr/docs.length:0;
  an.innerHTML='<svg viewBox="0 0 92 92" aria-hidden="true"><circle class="base" cx="46" cy="46" r="'+R+'" fill="none" stroke-width="8"/><circle class="lleno" cx="46" cy="46" r="'+R+'" fill="none" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-pct))+'"/></svg>';
  var num=el('div','num'); num.appendChild(el('b',null,apr+'/'+docs.length)); num.appendChild(el('small',null,t.aprobadosAn)); an.appendChild(num);
  an.setAttribute('role','img'); an.setAttribute('aria-label',apr+' / '+docs.length+' '+t.aprobadosAn);
  hero.appendChild(an);
  var tx=el('div');
  tx.appendChild(el('h2',null,pend?(pend===1?t.falta1:fmt(t.faltanN,{n:pend})):t.todoListo));
  if(!pend) tx.appendChild(el('p',null,t.todoListoSub));
  if(pend){var ir=el('button','ir',t.verFalta); ir.type='button'; ir.addEventListener('click',function(){SOLO_FALTA=true; pintar(); document.getElementById('docs').scrollIntoView({behavior:'smooth'});}); tx.appendChild(ir);}
  hero.appendChild(tx); app.appendChild(hero);

  var datos=el('div','datos');
  [[t.monto,dinero(p.monto)],[t.cierre,fechaBonita(p.cierre,p.idioma)]].forEach(function(x){var d=el('div','dato');d.appendChild(el('small',null,x[0]));d.appendChild(el('strong',null,x[1]));datos.appendChild(d);});
  app.appendChild(datos);

  // Etapas
  var nombresEt=en?ETAPAS_EN:ETAPAS_VER, idx=Math.max(0,ETAPAS.indexOf(p.etapa));
  var se=el('section','seccion'); se.appendChild(el('h2',null,SEC.prestamo));
  var et=el('div','etapas'); var riel=el('div','riel'); riel.setAttribute('aria-hidden','true');
  ETAPAS.forEach(function(_,i){riel.appendChild(el('i',i<idx?'hecha':(i===idx?'actual':'')));}); et.appendChild(riel);
  var ea=el('div','etapa-actual'); ea.appendChild(el('b',null,nombresEt[idx])); ea.appendChild(el('span',null,fmt(t.paso,{a:idx+1,b:ETAPAS.length}))); et.appendChild(ea);
  var ve=el('button','link',VER_ETAPAS?t.ocultarEtapas:t.verEtapas); ve.type='button'; ve.setAttribute('aria-expanded',String(VER_ETAPAS));
  ve.addEventListener('click',function(){VER_ETAPAS=!VER_ETAPAS;pintar();}); et.appendChild(ve);
  if(VER_ETAPAS){var ol=el('ol','lista-etapas'); nombresEt.forEach(function(n,i){ol.appendChild(el('li',i<idx?'hecha':(i===idx?'actual':''),n));}); et.appendChild(ol);}
  se.appendChild(et); app.appendChild(se);

  // Documentos por bloques, en el orden en que el equipo los puso
  var sd=el('section','seccion'); sd.id='docs'; var h=el('h2',null,SEC.docs);
  var fl=el('div','filtro'); fl.setAttribute('role','group');
  [[t.todos,false],[t.loQueFalta,true]].forEach(function(x){var b=el('button',null,x[0]); b.type='button'; b.setAttribute('aria-pressed',String(SOLO_FALTA===x[1])); b.addEventListener('click',function(){SOLO_FALTA=x[1];pintar();}); fl.appendChild(b);});
  h.appendChild(fl); sd.appendChild(h);
  var cats=[]; generales.forEach(function(x){var c=x.categoria||''; if(cats.indexOf(c)===-1)cats.push(c);});
  var algun=false;
  cats.forEach(function(cat){
    var lista=generales.filter(function(x){return (x.categoria||'')===cat;});
    var b=bloque('c_'+cat, en?(CATEGORIAS_EN[cat]||cat||'Other'):(cat||'Otros'), lista, t); if(b){sd.appendChild(b); algun=true;}
  });
  if(SOLO_FALTA && !algun) sd.appendChild(el('div','vacio',t.nadaFalta));
  app.appendChild(sd);

  // Propiedades
  function docsDe(pr){return docs.filter(function(x){return x.propiedad===pr.id;});}
  var sp=el('section','seccion'); sp.appendChild(el('h2',null,SEC.props)); sp.appendChild(el('p','subt',t.propsIntro));
  var principal=props.filter(function(x){return x.tipo==='Principal';})[0];
  if(principal){ var bp=propiedad(principal,docsDe(principal),t); if(bp) sp.appendChild(bp); }
  else { var np=el('div','nueva'); np.appendChild(el('div','b-tit',SEC.principal)); np.appendChild(formulario({},t,'Principal',true,null)); sp.appendChild(np); }
  [['EE.UU.',SEC.us,t.agregarUS,''],['País',SEC.otras,t.agregarOtra,t.otrasSub]].forEach(function(g){
    sp.appendChild(el('div','grupo-prop',g[1])); if(g[3]) sp.appendChild(el('p','subt',g[3]));
    var lista=props.filter(function(x){return x.tipo===g[0];});
    lista.forEach(function(pr){ var b=propiedad(pr,docsDe(pr),t); if(b) sp.appendChild(b); });
    if(AGREGANDO===g[0]){
      var caja=el('div','nueva'); caja.appendChild(el('div','b-tit',t.nueva));
      caja.appendChild(formulario({},t,g[0],true,function(){AGREGANDO=null;pintar();})); sp.appendChild(caja);
      setTimeout(function(){var i=caja.querySelector('input'); if(i) i.focus();},0);
    } else {
      if(!lista.length) sp.appendChild(el('p','subt',t.sinProps));
      var a=el('button','agregar',g[2]); a.type='button'; a.addEventListener('click',function(){AGREGANDO=g[0];pintar();}); sp.appendChild(a);
    }
  });
  app.appendChild(sp);

  // Equipo
  var sq=el('section','seccion'); sq.appendChild(el('h2',null,SEC.equipo));
  (p.contactos||[]).forEach(function(k){
    var r=el('div','persona'); var ini=k.nombre.split(' ').map(function(x){return x[0];}).slice(0,2).join('');
    r.appendChild(el('div','ini',ini)); var q=el('div','q'); q.appendChild(el('b',null,k.nombre)); q.appendChild(el('small',null,k.rol)); r.appendChild(q);
    var acc=el('div','acc');
    if(k.whatsapp){var w=el('a',null,'WhatsApp'); w.href='https://wa.me/'+k.whatsapp; w.target='_blank'; w.rel='noopener'; acc.appendChild(w);}
    if(k.email){var m=el('a',null,'Email'); m.href='mailto:'+k.email; acc.appendChild(m);}
    r.appendChild(acc); sq.appendChild(r);
  });
  app.appendChild(sq);
  app.appendChild(pie(t));

  // Botón fijo para subir
  var barra=document.getElementById('barra'), sub=document.getElementById('subir');
  if(p.carpeta){ sub.textContent=t.subir; sub.href=p.carpeta; barra.classList.remove('oculto'); app.className='con-barra'; }
  else { barra.classList.add('oculto'); app.className=''; }
}
